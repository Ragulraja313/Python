<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC + Chat + File Sharing</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    video { width: 45%; margin: 5px; border-radius: 12px; background: black; }
    #videos { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    #chat-box { width: 400px; height: 200px; border: 1px solid #ddd; background: white; padding: 10px; overflow-y: auto; }
    input, button { padding: 6px; margin: 3px; border-radius: 6px; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; }
    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <h2>WebRTC Video + Chat + File Sharing</h2>
  <div>
    <input id="roomInput" placeholder="Room name" value="demo-room">
    <input id="usernameInput" placeholder="Username" value="Alice">
    <button id="joinBtn">Join</button>
    <button id="leaveBtn">Leave</button>
  </div>

  <div id="videos">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="chat-section">
    <div id="chat-box"></div>
    <input id="chat-input" placeholder="Type message...">
    <button id="send-btn">Send</button>
    <form id="fileForm" enctype="multipart/form-data">
      <input type="file" id="fileInput" name="file">
      <button type="submit">Upload File</button>
    </form>
  </div>

  <script>
    const socket = io();
    const chatBox = document.getElementById("chat-box");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const fileForm = document.getElementById("fileForm");
    const fileInput = document.getElementById("fileInput");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    let pc, room, user, localStream;

    const iceConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function initMedia() {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection(iceConfig);
      pc.onicecandidate = e => {
        if (e.candidate) socket.emit("ice-candidate", { room, candidate: e.candidate });
      };
      pc.ontrack = e => { remoteVideo.srcObject = e.streams[0]; };
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    function addMessage(text, isLink=false) {
      const div = document.createElement("div");
      if (isLink) {
        const a = document.createElement("a");
        a.href = text.url;
        a.textContent = `${text.user}: ${text.filename}`;
        a.target = "_blank";
        div.appendChild(a);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("joinBtn").onclick = async () => {
      room = document.getElementById("roomInput").value.trim();
      const username = document.getElementById("usernameInput").value.trim();
      user = { username };
      await initMedia();
      createPeerConnection();
      socket.emit("join-room", { room, user });
    };

    document.getElementById("leaveBtn").onclick = () => {
      socket.emit("leave-room", { room });
      if (pc) pc.close();
      remoteVideo.srcObject = null;
    };

    sendBtn.onclick = () => {
      const msg = chatInput.value.trim();
      if (!msg) return;
      addMessage(`You: ${msg}`);
      socket.emit("chat-message", { room, message: msg, user });
      chatInput.value = "";
    };

    // File upload handler
    fileForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("room", room);
      formData.append("username", user.username);

      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (data.file_url) {
        addMessage(`You uploaded: ${fileInput.files[0].name}`);
      }
      fileInput.value = "";
    };

    // Socket events
    socket.on("chat-message", (data) => addMessage(`${data.user.username}: ${data.message}`));

    socket.on("file-shared", (data) => {
      addMessage({ user: data.user.username, filename: data.file_name, url: data.file_url }, true);
    });
  </script>
</body>
</html>
